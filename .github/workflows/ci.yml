name: CI — PromptJur

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Lint e verificação de tipos TypeScript
  # ─────────────────────────────────────────────
  lint-typecheck:
    name: Lint & TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Verificar tipos TypeScript
        run: pnpm exec tsc --noEmit

  # ─────────────────────────────────────────────
  # Job 2: Testes automatizados com Vitest
  # ─────────────────────────────────────────────
  test:
    name: Testes (Vitest)
    runs-on: ubuntu-latest
    needs: lint-typecheck

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Executar testes
        run: pnpm exec vitest run --reporter=verbose
        env:
          DATABASE_URL: ""
          JWT_SECRET: "ci-test-secret"
          VITE_APP_ID: "ci-test-app"
          OAUTH_SERVER_URL: "https://api.manus.im"
          VITE_OAUTH_PORTAL_URL: "https://manus.im"
          OWNER_OPEN_ID: "ci-test-owner"
          OWNER_NAME: "CI Test"
          BUILT_IN_FORGE_API_URL: "https://api.manus.im"
          BUILT_IN_FORGE_API_KEY: "ci-test-key"

  # ─────────────────────────────────────────────
  # Job 3: Build de produção
  # ─────────────────────────────────────────────
  build:
    name: Build de Produção
    runs-on: ubuntu-latest
    needs: lint-typecheck

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_APP_ID: "build-ci"
          VITE_OAUTH_PORTAL_URL: "https://manus.im"
          VITE_FRONTEND_FORGE_API_URL: "https://api.manus.im"
          VITE_FRONTEND_FORGE_API_KEY: "ci-build-key"
          VITE_APP_TITLE: "PromptJur"

      - name: Verificar artefatos do build
        run: ls -lh dist/public/assets/*.js | head -10

  # ─────────────────────────────────────────────
  # Job 4: Auditoria de Segurança de Dependências
  # ─────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Auditoria de segurança (high/critical)
        run: pnpm audit --audit-level=high || true

      - name: Verificar dependências desatualizadas
        run: pnpm outdated || true

      - name: Salvar resultado de auditoria na API
        if: always()
        env:
          APP_URL: ${{ vars.APP_URL }}
          CI_AUDIT_TOKEN: ${{ secrets.CI_AUDIT_TOKEN }}
        run: |
          START_TIME=$SECONDS
          AUDIT_JSON=$(pnpm audit --json 2>/dev/null || echo '{}')
          DURATION_MS=$(( (SECONDS - START_TIME) * 1000 ))

          # Extrair contagens do JSON
          PAYLOAD=$(echo "$AUDIT_JSON" | node -e "
            const data = require('fs').readFileSync('/dev/stdin','utf8');
            try {
              const j = JSON.parse(data);
              const vulns = j.vulnerabilities || {};
              const counts = { total: 0, critical: 0, high: 0, moderate: 0, low: 0, info: 0, vulns: [] };
              for (const [name, v] of Object.entries(vulns)) {
                counts.total++;
                const sev = v.severity || 'info';
                counts[sev] = (counts[sev] || 0) + 1;
                if (counts.vulns.length < 20) {
                  counts.vulns.push({ name, severity: sev, title: v.title || name, fixAvailable: v.fixAvailable !== false });
                }
              }
              console.log(JSON.stringify({
                totalVulnerabilities: counts.total,
                critical: counts.critical,
                high: counts.high,
                moderate: counts.moderate,
                low: counts.low,
                info: counts.info,
                vulnerabilities: counts.vulns,
                commitRef: process.env.GITHUB_SHA?.substring(0, 8) || 'unknown',
                durationMs: parseInt(process.env.DURATION_MS) || 0
              }));
            } catch(e) {
              console.log(JSON.stringify({ totalVulnerabilities: 0, critical: 0, high: 0, moderate: 0, low: 0, info: 0, vulnerabilities: [], commitRef: 'error', durationMs: 0 }));
            }
          ")

          if [ -n "$CI_AUDIT_TOKEN" ] && [ -n "$APP_URL" ]; then
            curl -sf -X POST "${APP_URL}/api/ci/audit" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${CI_AUDIT_TOKEN}" \
              -d "$PAYLOAD" && echo "[CI] Resultado de auditoria enviado com sucesso" \
              || echo "[CI] Falha ao enviar resultado (endpoint pode estar indisponível)"
          else
            echo "[CI] CI_AUDIT_TOKEN ou APP_URL não configurados - pulando envio"
          fi
