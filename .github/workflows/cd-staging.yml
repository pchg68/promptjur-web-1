name: CD — Staging Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Forçar deploy mesmo sem mudanças'
        required: false
        default: 'false'
        type: boolean

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9'

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Validação pré-deploy
  # ─────────────────────────────────────────────
  validate:
    name: Validação Pré-Deploy
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      commit_sha: ${{ github.sha }}
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verificar se há mudanças relevantes
        id: check
        run: |
          if [ "${{ github.event.inputs.force_deploy }}" = "true" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "Deploy forçado via workflow_dispatch"
            exit 0
          fi
          # Verificar se houve mudanças em arquivos relevantes
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E '^(server|client|drizzle|shared)/' | wc -l)
          if [ "$CHANGED" -gt 0 ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "$CHANGED arquivo(s) relevante(s) alterado(s)"
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "Nenhuma mudança relevante detectada — pulando deploy"
          fi

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Executar testes
        run: pnpm exec vitest run --reporter=verbose
        env:
          DATABASE_URL: ''
          JWT_SECRET: 'staging-ci-secret'
          VITE_APP_ID: 'staging-ci-app'
          OAUTH_SERVER_URL: 'https://api.manus.im'
          VITE_OAUTH_PORTAL_URL: 'https://manus.im'
          OWNER_OPEN_ID: 'staging-ci-owner'
          OWNER_NAME: 'Staging CI'
          BUILT_IN_FORGE_API_URL: 'https://api.manus.im'
          BUILT_IN_FORGE_API_KEY: 'staging-ci-key'

  # ─────────────────────────────────────────────
  # Job 2: Build de Staging
  # ─────────────────────────────────────────────
  build-staging:
    name: Build Staging
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.should_deploy == 'true'
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Build de produção
        run: pnpm build
        env:
          NODE_ENV: production
          VITE_APP_ID: ${{ secrets.STAGING_APP_ID || 'staging-app' }}
          VITE_OAUTH_PORTAL_URL: ${{ secrets.STAGING_OAUTH_PORTAL_URL || 'https://manus.im' }}
          VITE_FRONTEND_FORGE_API_URL: ${{ secrets.STAGING_FORGE_API_URL || 'https://api.manus.im' }}
          VITE_FRONTEND_FORGE_API_KEY: ${{ secrets.STAGING_FORGE_API_KEY || '' }}
          VITE_APP_TITLE: 'PromptJur [STAGING]'
          VITE_APP_URL: ${{ secrets.STAGING_APP_URL || '' }}

      - name: Verificar artefatos do build
        run: |
          echo "=== Build artifacts ==="
          ls -lh dist/public/assets/*.js | head -10
          echo ""
          echo "=== Bundle size ==="
          du -sh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: staging-build-${{ github.sha }}
          path: dist/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 3: Deploy para Staging
  # ─────────────────────────────────────────────
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [validate, build-staging]
    if: needs.validate.outputs.should_deploy == 'true'
    environment:
      name: staging
      url: ${{ secrets.STAGING_URL || 'https://staging.promptjur.com.br' }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: staging-build-${{ github.sha }}
          path: dist/

      - name: Deploy para ambiente de staging
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  DEPLOY STAGING — PromptJur"
          echo "═══════════════════════════════════════════════"
          echo ""
          echo "  Commit: ${{ github.sha }}"
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Autor:  ${{ github.actor }}"
          echo "  Data:   $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "═══════════════════════════════════════════════"
          echo ""
          echo "ℹ️  O deploy real é gerenciado pelo Manus Platform."
          echo "    Este workflow valida, builda e prepara os artefatos."
          echo ""
          echo "    Para publicar em produção:"
          echo "    1. Faça merge de develop → main"
          echo "    2. Clique em 'Publish' no painel do Manus"
          echo ""
          echo "    Para staging manual:"
          echo "    - Use o artifact 'staging-build-${{ github.sha }}'"
          echo "    - Ou configure STAGING_DEPLOY_HOOK secret"
          echo ""

      # Webhook de deploy (opcional — configurar STAGING_DEPLOY_HOOK)
      - name: Trigger deploy webhook
        if: secrets.STAGING_DEPLOY_HOOK != ''
        run: |
          curl -X POST "${{ secrets.STAGING_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "commit": "${{ github.sha }}",
              "branch": "${{ github.ref_name }}",
              "actor": "${{ github.actor }}",
              "timestamp": "'$(date -u '+%Y-%m-%dT%H:%M:%SZ')'"
            }' || echo "Webhook falhou (não-crítico)"

  # ─────────────────────────────────────────────
  # Job 4: Smoke Tests pós-deploy
  # ─────────────────────────────────────────────
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: secrets.STAGING_URL != ''
    steps:
      - name: Aguardar deploy estabilizar
        run: sleep 30

      - name: Health check
        run: |
          STAGING_URL="${{ secrets.STAGING_URL }}"
          echo "Verificando health em: ${STAGING_URL}/api/health"
          
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${STAGING_URL}/api/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ Health check OK (tentativa $i)"
              exit 0
            fi
            echo "⏳ Tentativa $i: HTTP $STATUS — aguardando..."
            sleep 10
          done
          
          echo "✗ Health check falhou após 5 tentativas"
          exit 1

      - name: Verificar endpoints críticos
        run: |
          STAGING_URL="${{ secrets.STAGING_URL }}"
          
          echo "=== Verificando endpoints ==="
          
          # Homepage
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${STAGING_URL}/" || echo "000")
          echo "Homepage: HTTP $STATUS"
          [ "$STATUS" = "200" ] || exit 1
          
          # tRPC
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${STAGING_URL}/api/trpc/auth.me" || echo "000")
          echo "tRPC auth.me: HTTP $STATUS"
          # 401 é esperado (não autenticado)
          [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ] || exit 1
          
          echo ""
          echo "✓ Todos os smoke tests passaram"

  # ─────────────────────────────────────────────
  # Job 5: Notificação
  # ─────────────────────────────────────────────
  notify:
    name: Notificação
    runs-on: ubuntu-latest
    needs: [validate, build-staging, deploy-staging]
    if: always()
    steps:
      - name: Resumo do deploy
        run: |
          echo "## Deploy Staging — Resumo" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Autor | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Validação | ${{ needs.validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.deploy-staging.result }}" = "success" ]; then
            echo "✅ **Deploy staging concluído com sucesso**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.validate.outputs.should_deploy }}" = "false" ]; then
            echo "⏭️ **Deploy pulado** — nenhuma mudança relevante" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Deploy falhou** — verificar logs acima" >> $GITHUB_STEP_SUMMARY
          fi
