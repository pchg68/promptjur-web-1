services:
  - type: web
    name: promptjur-web
    runtime: node
    plan: starter
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
    healthCheckPath: /
    autoDeploy: true

databases:
  - name: promptjur-db
    plan: starter
    databaseName: promptjur
    user: promptjur
