<!doctype html>
<html lang="pt-BR">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- SEO Básico -->
    <meta name="description" content="PromptJur: plataforma de engenharia de prompts jurídicos com IA. Crie, analise e otimize prompts para peças jurídicas com precisão profissional." />
    <meta name="keywords" content="prompts jurídicos, engenharia de prompts, inteligência artificial jurídica, IA para advogados, geração de peças jurídicas, otimização de prompts, direito e tecnologia, LegalTech, PromptJur" />
    <meta name="author" content="PromptJur" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://promptjur.com/" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://promptjur.com/" />
    <meta property="og:title" content="PromptJur — Engenharia de Prompts Jurídicos com IA" />
    <meta property="og:description" content="Crie, analise e otimize prompts jurídicos com inteligência artificial. Economize tempo e melhore a qualidade das suas peças legais." />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="PromptJur" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PromptJur — Engenharia de Prompts Jurídicos com IA" />
    <meta name="twitter:description" content="Crie, analise e otimize prompts jurídicos com inteligência artificial. Economize tempo e melhore a qualidade das suas peças legais." />

    <!-- Favicon e ícone Apple -->
    <link rel="icon" type="image/png" href="%VITE_APP_LOGO%" />
    <link rel="apple-touch-icon" href="%VITE_APP_LOGO%" />

    <title>%VITE_APP_TITLE%</title>

    <!-- JSON-LD: Dados Estruturados (Schema.org) para o Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SoftwareApplication",
          "name": "PromptJur",
          "url": "https://promptjur.com",
          "description": "Plataforma de engenharia de prompts jurídicos com inteligência artificial. Crie, analise e otimize prompts para peças jurídicas com precisão profissional.",
          "applicationCategory": "LegalApplication",
          "operatingSystem": "Web",
          "inLanguage": "pt-BR",
          "offers": {
            "@type": "AggregateOffer",
            "priceCurrency": "BRL",
            "lowPrice": "0",
            "offerCount": "3",
            "offers": [
              { "@type": "Offer", "name": "Gratuito", "price": "0", "priceCurrency": "BRL" },
              { "@type": "Offer", "name": "Pro", "price": "97", "priceCurrency": "BRL" },
              { "@type": "Offer", "name": "Escritório", "price": "197", "priceCurrency": "BRL" }
            ]
          },
          "audience": {
            "@type": "Audience",
            "audienceType": "Advogados, Estudantes de Direito, Escritórios de Advocacia"
          },
          "featureList": [
            "Geração de prompts jurídicos com IA",
            "Análise e otimização de prompts",
            "Biblioteca de templates jurídicos",
            "Assistente jurídico com IA",
            "Exportação de peças em DOCX e PDF"
          ]
        },
        {
          "@type": "Organization",
          "name": "PromptJur",
          "url": "https://promptjur.com",
          "logo": "https://promptjur.com/logo.png",
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer support",
            "url": "https://promptjur.com/contato",
            "availableLanguage": "Portuguese"
          },
          "sameAs": []
        },
        {
          "@type": "WebSite",
          "name": "PromptJur",
          "url": "https://promptjur.com",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://promptjur.com/biblioteca-publica?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
